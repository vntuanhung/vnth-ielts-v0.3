<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IELTS for VNTH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{--paper:#EDF0F3;--sheet:#fff;--ink:#1B2A41;--muted:#5B6B7F;--line:#CBD3DC;--blue:#2F5D8A;--mark:#FFE066;--ok:#2E7D4F;--bad:#B3402F;--okbg:#E4F2E9;--badbg:#F8E5E1}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 "Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:var(--blue)}
h1,h2,h3{font-family:"Source Serif 4",Georgia,serif;line-height:1.2;margin:0 0 .5em}
h1{font-size:clamp(2rem,5vw,3.2rem);font-weight:700}
h2{font-size:1.5rem}
h3{font-size:1.2rem}
.top{display:flex;align-items:center;gap:20px;padding:12px 24px;background:var(--ink);color:#fff;flex-wrap:wrap}
.brand{font-family:"Source Serif 4",serif;font-weight:700;font-size:1.25rem;color:#fff;text-decoration:none}
.brand span{background:var(--mark);color:var(--ink);padding:0 6px;margin-left:2px}
nav.main{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav.main a{color:#C9D4E3;text-decoration:none;padding:6px 12px;border-radius:6px;font-size:.95rem}
nav.main a:hover,nav.main a.on{background:rgba(255,255,255,.14);color:#fff}
main{max-width:1180px;margin:0 auto;padding:28px 20px 80px}
.lead{color:var(--muted);max-width:60ch;margin:0 0 28px}
.btn{display:inline-block;font:inherit;font-weight:600;font-size:.95rem;padding:9px 16px;border:1.5px solid var(--ink);background:var(--sheet);color:var(--ink);border-radius:8px;cursor:pointer;text-decoration:none}
.btn:hover{background:#F4F7FA}
.btn.primary{background:var(--ink);color:#fff}
.btn.primary:hover{background:#2A3E5C}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.small{padding:5px 10px;font-size:.85rem}
.btn:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.skills{display:grid;border-top:2px solid var(--ink)}
.skill{display:grid;grid-template-columns:minmax(150px,1.1fr) 3fr auto;align-items:center;gap:24px;padding:24px 8px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.skill:hover{background:var(--sheet)}
.skill b{font-family:"Source Serif 4",serif;font-size:2.1rem;line-height:1.1;background:linear-gradient(transparent 62%,var(--mark) 62%);justify-self:start}
.skill p{margin:0;color:var(--muted)}
.skill .go{font-weight:600;white-space:nowrap}
@media(max-width:720px){.skill{grid-template-columns:1fr;gap:6px}}
.test{background:var(--sheet);border:1px solid var(--line);border-left:5px solid var(--blue);padding:18px 20px;margin-bottom:16px;border-radius:4px}
.test .sub{color:var(--muted);margin:0 0 12px}
.minis{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.minis em{font-style:normal;color:var(--muted);font-size:.9rem;margin-right:4px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{justify-content:space-between}
.empty{background:var(--sheet);border:2px dashed var(--line);padding:22px;text-align:center;color:var(--muted);border-radius:6px}
.tagk{display:inline-block;font-size:.78rem;font-weight:600;padding:1px 9px;border-radius:99px;background:#E3EAF2;color:var(--blue);margin-left:6px;vertical-align:middle}
.secbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--ink);margin:34px 0 14px;padding-bottom:6px}
.secbar h2{margin:0}
/* generic panels */
.src,.qs,.panel{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:20px 22px}
.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--sheet);border:1.5px solid var(--ink);border-radius:8px;padding:10px 16px;margin-bottom:14px}
.clock{font-size:1.9rem;font-weight:700;font-variant-numeric:tabular-nums;padding:2px 14px;border-radius:6px}
.clock.warn{background:var(--mark)}
.clock.urgent{background:var(--bad);color:#fff}
.split{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
@media(max-width:900px){.split{grid-template-columns:1fr}}
.src{position:sticky;top:84px;max-height:calc(100vh - 100px);overflow:auto}
@media(max-width:900px){.src{position:static;max-height:none}}
.passage{font-family:"Source Serif 4",Georgia,serif;font-size:1.08rem;line-height:1.7}
.passage p{margin:0 0 1em}
.score{display:flex;gap:28px;align-items:baseline;flex-wrap:wrap;margin:6px 0 20px}
.score .big{font-family:"Source Serif 4",serif;font-size:3.6rem;font-weight:700;line-height:1;background:linear-gradient(transparent 62%,var(--mark) 62%)}
.rv{border:1px solid var(--line);border-left-width:5px;border-radius:4px;padding:12px 16px;margin-bottom:10px;background:var(--sheet)}
.rv.ok{border-left-color:var(--ok)}
.rv.no{border-left-color:var(--bad)}
.tag{display:inline-block;font-size:.8rem;font-weight:700;padding:1px 8px;border-radius:99px}
.tag.ok{background:var(--okbg);color:var(--ok)}
.tag.no{background:var(--badbg);color:var(--bad)}
.exp{background:#F4F7FA;border-radius:6px;padding:8px 12px;margin-top:8px;font-size:.95rem}
.optlist{margin:6px 0;padding-left:0;list-style:none;font-size:.95rem}
.muted{color:var(--muted)}
.wc{font-weight:600}.wc.low{color:var(--bad)}.wc.ok{color:var(--ok)}
.essay{width:100%;min-height:55vh;font-family:"Source Serif 4",Georgia,serif;font-size:1.08rem;line-height:1.7}
.promptbox{white-space:pre-wrap;font-family:"Source Serif 4",Georgia,serif;font-size:1.08rem}
.cue{white-space:pre-wrap;font-family:"Source Serif 4",serif;font-size:1.2rem;border:2px solid var(--ink);padding:18px 22px;border-radius:4px;background:#fffbe6}
input[type=text],textarea,select{width:100%;font:inherit;padding:9px 11px;border:1.5px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}
textarea{resize:vertical}
.form label{display:block;font-weight:600;margin:14px 0 5px;font-size:.92rem}
.form label.inl{display:flex;gap:8px;align-items:center;font-weight:500}
.form label.inl input{width:auto}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.epart{border:1.5px solid var(--ink);border-radius:8px;padding:16px;margin:16px 0;background:var(--sheet)}
.egrp{border:1.5px dashed var(--blue);border-radius:8px;padding:14px;margin:16px 0;background:#F7FAFD}
.eq{border:1px solid var(--line);border-radius:6px;padding:12px;margin:12px 0;background:#fff}
.eqh{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.eqh select{width:auto}
.eq textarea,.eq input,.eq select{margin-bottom:6px}
.chk{display:inline-flex;gap:4px;align-items:center;margin-right:12px;font-weight:500}
.chk input{width:auto;margin:0}
table.t{width:100%;border-collapse:collapse;background:var(--sheet)}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;font-size:.95rem}
table.t th{background:#F4F7FA}
table.t tr.click{cursor:pointer}
table.t tr.click:hover{background:#F0F4F8}
.meter{height:8px;background:var(--badbg);border-radius:4px;overflow:hidden;min-width:90px}
.meter i{display:block;height:100%;background:var(--ok)}
details.w{background:var(--sheet);border:1px solid var(--line);border-left:5px solid var(--bad);border-radius:4px;margin-bottom:8px}
details.w summary{padding:10px 14px;cursor:pointer;font-weight:500}
details.w .wb{padding:0 14px 12px}
mark.ev{padding:0 2px;border-radius:2px;color:inherit}
mark.ev-no{background:#FFD6CF;border-bottom:2px solid var(--bad)}
mark.ev-ok{background:#CDEBD8;border-bottom:2px solid var(--ok)}
mark.ev sup{font-size:.7em;font-weight:700;margin-right:2px}
mark.pulse{animation:flash .6s 3}
@keyframes flash{50%{background:var(--mark)}}
.evtext{max-height:60vh;overflow:auto}
.evbar{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.evlegend{font-size:.88rem;color:var(--muted);margin:6px 0 10px}
.evbox{margin-top:12px;border-top:1px dashed var(--line);padding-top:12px}
.rvsplit{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
@media(max-width:900px){.rvsplit{grid-template-columns:1fr}}
.rvsplit .src{top:12px;max-height:calc(100vh - 24px)}
.nb{position:relative}
.nb.flag{box-shadow:inset 0 0 0 2px #E08A00}
.nb.flag::after{content:'';position:absolute;top:0;right:0;border:5px solid transparent;border-top-color:#E08A00;border-right-color:#E08A00}
.fcount{font-size:.85rem;color:#B36B00;font-weight:700;white-space:nowrap;margin-left:6px}
.xqside{display:flex;flex-direction:column;align-items:center;gap:4px}
.flagbtn{border:0;background:none;cursor:pointer;font-size:1.1rem;color:#9AA5B1;padding:0;line-height:1}
.flagbtn.on{color:#E08A00}
.fb{margin-top:8px;padding:8px 12px;border-radius:6px;font-size:.95rem}
.fb.ok{background:var(--okbg);border-left:4px solid var(--ok)}
.fb.no{background:var(--badbg);border-left:4px solid var(--bad)}
.modes{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 20px}
.filters select{width:auto;min-width:180px}
.colh{font-family:"Source Serif 4",serif;font-size:1.3rem;margin:26px 0 10px;border-bottom:2px solid var(--ink);padding-bottom:4px}
.vcard{background:#fff;border:2px solid var(--ink);border-radius:10px;padding:28px;text-align:center;margin:18px 0}
.vcard .w{font-family:"Source Serif 4",serif;font-size:2rem;font-weight:700}
.hero{position:relative;border:2px solid var(--ink);border-radius:6px;overflow:hidden;aspect-ratio:800/300;min-height:170px;background:#1D2B53}
.slide{position:absolute;inset:0;opacity:0;transition:opacity 1.2s ease}
.slide.on{opacity:1}
.slide svg,.slide img{width:100%;height:100%;object-fit:cover;display:block}
.hcap{position:absolute;left:0;bottom:0;background:rgba(27,42,65,.88);color:#fff;padding:8px 16px;font-size:.95rem}
.hcap b{font-family:"Source Serif 4",serif;font-size:1.1rem;margin-right:10px}
.hdots{display:none}
.hdots button{width:14px;height:14px;border-radius:50%;border:2px solid #fff;background:transparent;padding:0;cursor:pointer}
.hdots button.on{background:var(--mark);border-color:var(--mark)}
.goal{display:grid;grid-template-columns:auto 1fr;gap:12px 36px;align-items:center;padding:24px 4px 26px;border-bottom:2px solid var(--ink);margin-bottom:30px}
@media(max-width:720px){.goal{grid-template-columns:1fr}}
.goal .gl{font-weight:600;color:var(--muted)}
.goal .gnum{font-family:"Source Serif 4",serif;font-size:clamp(2.6rem,7vw,4rem);font-weight:700;line-height:1.05;background:linear-gradient(transparent 62%,var(--mark) 62%);display:inline-block}
.goal .gnow{color:var(--muted);font-size:.92rem;margin-top:6px}
.gq{margin:0;font-family:"Source Serif 4",Georgia,serif;font-style:italic;font-size:clamp(1.15rem,2.6vw,1.6rem);line-height:1.4;border-left:4px solid var(--ink);padding-left:18px;min-height:3.6em;display:flex;align-items:center}
@media(prefers-reduced-motion:reduce){.slide{transition:none}}
.harr{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:56px;border:0;background:rgba(27,42,65,.55);color:#fff;font-size:2rem;line-height:1;cursor:pointer;z-index:2}
.harr:hover{background:rgba(27,42,65,.85)}
.harr.l{left:0;border-radius:0 8px 8px 0}.harr.r{right:0;border-radius:8px 0 0 8px}
.hnote{margin-left:10px;background:var(--mark);color:var(--ink);padding:1px 9px;border-radius:99px;font-size:.82rem;font-weight:600}
.hnote[hidden]{display:none}
.hcount{position:absolute;right:10px;bottom:10px;background:rgba(27,42,65,.88);color:#fff;padding:3px 10px;border-radius:99px;font-size:.85rem}
.skillgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin:6px 0 10px}
@media(max-width:900px){.skillgrid{grid-template-columns:repeat(2,1fr)}}
.sbtn{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:26px 12px 22px;background:var(--sheet);color:var(--ink);border:2px solid var(--ink);border-radius:14px;text-decoration:none;box-shadow:5px 5px 0 var(--ink);transition:transform .12s,box-shadow .12s}
.sbtn:hover{transform:translate(2px,2px);box-shadow:3px 3px 0 var(--ink)}
.sbtn:active{transform:translate(5px,5px);box-shadow:0 0 0 var(--ink)}
.sbtn .sico{display:grid;place-items:center;width:76px;height:76px;border-radius:50%;background:var(--mark);border:2px solid var(--ink);margin-bottom:6px}
.sbtn b{font-family:"Source Serif 4",serif;font-size:1.5rem}
.sbtn small{color:var(--muted);font-size:.9rem}
@media(prefers-reduced-motion:reduce){.sbtn{transition:none}}
#toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%) translateY(30px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;opacity:0;pointer-events:none;transition:.2s;z-index:80;max-width:90vw}
#toast.on{opacity:1;transform:translateX(-50%)}
audio{width:100%;margin:6px 0}
.rec{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--bad);margin-right:6px;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
@media(prefers-reduced-motion:reduce){.rec{animation:none}#toast{transition:none}}
.err{color:var(--bad);font-weight:600}
.pdf{width:100%;height:70vh;border:1px solid var(--line)}
/* ===== exam mode ===== */
body.exam{background:#fff;font-family:Arial,Helvetica,sans-serif;overflow:hidden}
body.exam .top{display:none}
body.exam main{max-width:none;padding:0}
.xhead{position:fixed;top:0;left:0;right:0;height:56px;background:#fff;border-bottom:1px solid #bbb;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 18px;z-index:30}
.xlogo{font-weight:900;font-size:1.35rem;color:#fff;background:#C8102E;padding:2px 10px;letter-spacing:1px}
.xwho{color:#555;font-size:.9rem;margin-left:12px}
.xtimer{font-size:1.05rem;font-weight:700;text-align:center}
.xtimer .clock{font-size:1.4rem;padding:0 10px;display:inline-block}
.xsub{position:fixed;top:56px;left:0;right:0;height:42px;background:#E9ECEF;border-bottom:1px solid #bbb;padding:0 18px;display:flex;align-items:center;gap:10px;z-index:29;font-size:.95rem;overflow:hidden;white-space:nowrap}
.xbody{position:fixed;top:98px;bottom:58px;left:0;right:0;display:grid;grid-template-columns:1fr 1fr}
.xpane{overflow:auto;padding:18px 28px}
.xpane.l{border-right:4px solid #D5D9DE}
@media(max-width:900px){.xbody{grid-template-columns:1fr;grid-template-rows:1fr 1fr}.xpane.l{border-right:0;border-bottom:4px solid #D5D9DE}.xpane{padding:12px 14px}.xwho{display:none}}
.xfoot{position:fixed;bottom:0;left:0;right:0;height:58px;background:#F3F4F6;border-top:1px solid #bbb;display:flex;align-items:center;gap:8px;padding:0 12px;overflow-x:auto;z-index:30}
.fpart{display:flex;align-items:center;gap:5px;padding:5px 10px;border:1px solid transparent;background:none;font:inherit;font-size:.9rem;cursor:pointer;white-space:nowrap;border-radius:4px}
.fpart.on{border-color:#999;background:#fff;cursor:default}
.fpart:not(.on):hover{background:#E4E7EB}
.nb{min-width:30px;height:30px;padding:0 6px;border:1px solid #888;background:#fff;font:inherit;font-size:.85rem;cursor:pointer;border-radius:3px}
.nb.done{background:#1B2A41;color:#fff;border-color:#1B2A41}
.xpane .passage{font-family:Arial,Helvetica,sans-serif;font-size:1rem;line-height:1.65}
.xpane h2{font-family:Arial,Helvetica,sans-serif;font-size:1.25rem}
.para{display:flex;gap:10px;align-items:flex-start;margin-bottom:1em}
.para p{margin:0;flex:1}
.pl{display:inline-grid;place-items:center;min-width:24px;height:24px;background:#E9ECEF;border:1px solid #bbb;font-size:.85rem}
.ghead{margin:6px 0 10px}
.ghead .ginstr{background:#F3F4F6;border:1px solid #ccc;padding:8px 12px;margin-top:6px;font-size:.95rem}
.optbox{border:1px solid #bbb;padding:8px 14px;margin:8px 0 14px;background:#fff;font-size:.95rem}
.optbox ul{margin:6px 0 0;padding:0;list-style:none}
.optbox li{padding:1px 0}
.xq{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px dotted #ccc}
.xqn{min-width:34px;height:26px;padding:0 6px;display:grid;place-items:center;border:1.5px solid #1B2A41;font-weight:700;font-size:.85rem;border-radius:3px;background:#fff}
.xqb{flex:1}
.xqb p.qt{margin:0 0 6px}
.xqb .opt{display:flex;gap:8px;align-items:flex-start;padding:4px 6px;cursor:pointer}
.xqb .opt input{margin-top:4px;width:auto}
.xqb select{width:auto;min-width:80px;padding:5px 8px}
.xqb input[type=text].blank{display:inline-block;width:150px;padding:3px 8px;margin:0 4px}
.mapimg{max-width:100%;border:1px solid #bbb;margin:6px 0}
mark.hl{background:var(--mark);color:inherit;padding:0 1px;cursor:pointer}
mark.hn{background:#BFE3FF;border-bottom:2px solid #2F7FC1}
#hlmenu{position:fixed;z-index:90;background:#1B2A41;color:#fff;border-radius:8px;padding:6px;display:flex;gap:6px;align-items:center;box-shadow:0 4px 14px rgba(0,0,0,.3);max-width:300px;flex-wrap:wrap}
#hlmenu[hidden]{display:none}
#hlmenu button{font:inherit;font-size:.85rem;font-weight:600;border:0;border-radius:5px;padding:5px 10px;background:#fff;color:#1B2A41;cursor:pointer}
#hlmenu .mn{font-size:.85rem;max-width:280px;padding:2px 6px}
.notes{position:fixed;right:12px;top:108px;width:320px;max-height:calc(100vh - 190px);overflow:auto;background:#fff;border:1.5px solid #1B2A41;border-radius:8px;padding:12px;z-index:40;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.notes[hidden]{display:none}
.notes textarea{min-height:140px}
.notes li{font-size:.88rem;margin-bottom:6px}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="#/">IELTS for <span>VNTH</span></a>
  <nav class="main">
    <a href="#/" data-k="home">Trang chủ</a>
    <a href="#/manage" data-k="manage">Quản lý đề</a>
    <a href="#/history" data-k="history">Lịch sử</a>
    <a href="#/vocab" data-k="vocab">Từ vựng</a>
    <a href="#/backup" data-k="backup">Sao lưu</a>
  </nav>
</header>
<main id="app"></main>
<div id="hlmenu" hidden onmousedown="event.preventDefault()"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
/* ============ helpers ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const fmt=s=>{s=Math.max(0,Math.round(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const fdate=d=>new Date(d).toLocaleString('vi-VN',{dateStyle:'short',timeStyle:'short'});
const wcount=t=>t.trim()?t.trim().split(/\s+/).length:0;
function app(h){$('#app').innerHTML=h;window.scrollTo(0,0)}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2800)}
let cleanups=[];
const onLeave=f=>cleanups.push(f);
function cleanup(){cleanups.forEach(f=>{try{f()}catch(e){}});cleanups=[]}
async function copyText(t){
  try{await navigator.clipboard.writeText(t);toast('Đã sao chép. Dán vào chat IELTS với Claude để được chấm.')}
  catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('Đã sao chép.')}
}
function download(name,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}

/* ============ file storage (IndexedDB) ============ */
const idb=new Promise((res,rej)=>{const r=indexedDB.open('ielts_studio_files',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const fput=async(k,b)=>{const d=await idb;return new Promise((res,rej)=>{const tx=d.transaction('f','readwrite');tx.objectStore('f').put(b,k);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})};
const fget=async k=>{const d=await idb;return new Promise((res,rej)=>{const r=d.transaction('f').objectStore('f').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})};
const fdel=async k=>{if(!k)return;const d=await idb;return new Promise(res=>{const tx=d.transaction('f','readwrite');tx.objectStore('f').delete(k);tx.oncomplete=res;tx.onerror=res})};
const fkeys=async()=>{const d=await idb;return new Promise((res,rej)=>{const r=d.transaction('f').objectStore('f').getAllKeys();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})};
async function blobUrl(k){const b=await fget(k);if(!b)return null;const u=URL.createObjectURL(b);onLeave(()=>URL.revokeObjectURL(u));return u}

const labelOf=(g,i)=>QT[g.type].roman?(ROMAN[i]||String(i+1)):String.fromCharCode(65+i);
const gCount=g=>(g.options&&g.options.filter(x=>x.trim()).length)||g.count||5;
const gLabels=g=>{const a=[];for(let i=0;i<gCount(g);i++)a.push(labelOf(g,i));return a};
const qMarks=(q,g)=>QT[g.type].kind==='multi'?Math.max(1,String(q.answer||'').split(',').filter(Boolean).length):1;
const normAns=s=>String(s).toLowerCase().replace(/[£$,]/g,'').replace(/\.$/,'').replace(/\s+/g,' ').trim();
function score(q,g,a){
  const k=QT[g.type].kind;
  if(k==='multi'){const c=String(q.answer).toUpperCase().split(',').map(s=>s.trim()).filter(Boolean),s=Array.isArray(a)?a:[];if(s.length>c.length)return 0;return s.filter(x=>c.includes(x)).length}
  if(a==null||a==='')return 0;
  if(k==='fill'){if(g.maxWords&&wcount(String(a))>g.maxWords)return 0;return String(q.answer).split('|').some(x=>normAns(x)===normAns(a))?1:0}
  return String(a).toLowerCase()===String(q.answer).toLowerCase()?1:0;
}
function instr(g,skill){
  if(g.title)return g.title;
  const T=QT[g.type],src=skill==='reading'?'the passage':'the recording',lim=g.maxWords?`NO MORE THAN ${NUMW[g.maxWords]} WORD${g.maxWords>1?'S':''} AND/OR A NUMBER`:'the correct answer';
  if(g.type==='mcq')return 'Choose the correct letter, A, B, C or D.';
  if(T.kind==='multi'){const n=g.questions[0]?qMarks(g.questions[0],g):2;return `Choose ${NUMW[n]||n} letters.`}
  if(g.type==='tfng')return 'Do the following statements agree with the information given in the passage? Write TRUE if the statement agrees with the information, FALSE if it contradicts the information, NOT GIVEN if there is no information on this.';
  if(g.type==='ynng')return "Do the following statements agree with the views of the writer? Write YES if the statement agrees with the views of the writer, NO if it contradicts the views of the writer, NOT GIVEN if it is impossible to say what the writer thinks about this.";
  if(g.type==='match_headings')return 'Choose the correct heading for each paragraph from the list of headings below.';
  if(g.type==='match_info')return 'Which paragraph contains the following information? Write the correct letter.';
  if(g.type==='match_features')return 'Match each statement with the correct option. Write the correct letter.';
  if(g.type==='match_endings')return 'Complete each sentence with the correct ending. Write the correct letter.';
  if(g.type==='matching')return 'Match each item with the correct option. Write the correct letter.';
  if(g.type==='summary_bank')return 'Complete the summary using the list of words below. Write the correct letter.';
  if(g.type==='map_label')return 'Label the map. Write the correct letter.';
  return `Complete the ${T.noun}. Write ${lim} from ${src} for each answer.`;
}

function migrate(d){
  (d.tests||[]).forEach(t=>t.parts.forEach(p=>{
    if(!p.groups){
      const gs=[];
      (p.questions||[]).forEach(q=>{
        const ty=q.type==='fill'?'sentence_comp':(q.type||'mcq');
        let g=gs[gs.length-1];
        if(!g||g.type!==ty){g=newGroup(ty);gs.push(g)}
        g.questions.push({q:q.q||'',options:q.options||[],answer:String(q.answer||''),explain:q.explain||''});
      });
      p.groups=gs;delete p.questions;
    }
    if(p.labelParas===undefined)p.labelParas=false;
  }));
  ['writing','speaking','attempts','essays','recs','vocab'].forEach(k=>{if(!Array.isArray(d[k]))d[k]=[]});
  if(!d.drafts)d.drafts={};
  return d;
}

let heroIdx=0,heroTimer=null;
function heroLoad(i){
  i=(i+HERO.length)%HERO.length;
  const el=document.querySelector('.slide[data-i="'+i+'"]');
  if(el&&!el.dataset.ld){
    const h=HERO[i];
    el.innerHTML=HERO_PHOTOS[h.key]?`<img src="${esc(HERO_PHOTOS[h.key])}" alt="${esc(h.name)}" onerror="this.outerHTML=HERO[${i}].svg">`:h.svg;

  }
}
function heroShow(i){
  heroIdx=(i+HERO.length)%HERO.length;
  heroLoad(heroIdx);heroLoad(heroIdx+1);
  document.querySelectorAll('.slide').forEach((el,n)=>{el.classList.toggle('on',n===heroIdx);el.setAttribute('aria-hidden',n===heroIdx?'false':'true')});

  <p class="lead">Chọn thi thử (tính giờ) hoặc luyện tập (không giới hạn giờ, kiểm tra đáp án ngay) sau khi bấm vào một đề.</p>
  <div class="filters"><select aria-label="Lọc theo bộ đề" onchange="setLF('col',this.value)"><option value="all">Tất cả bộ đề</option>${cols.map(c=>`<option value="${esc(c)}" ${LF.col===c?'selected':''}>${esc(c)}</option>`).join('')}<option value="none" ${LF.col==='none'?'selected':''}>Chưa phân bộ</option></select>
  <select aria-label="Lọc theo dạng bài" onchange="setLF('type',this.value)"><option value="all">Tất cả dạng bài</option>${present.map(x=>`<option value="${x}" ${LF.type===x?'selected':''}>${esc(QT[x].n)}</option>`).join('')}</select></div>
  ${tests.length?order.map(c=>`<h2 class="colh">${esc(c)}</h2>${groups[c].map(card).join('')}`).join(''):`<div class="empty">${all.length?'Không có đề nào khớp bộ lọc.':'Chưa có đề '+name+'. Bấm "Thêm đề '+name+'" để tạo đề đầu tiên.'}</div>`}`);
}
function listWriting(){

/* ============ test runner: exam interface ============ */
let R=null,HM=null;
function runTest(id,scope){
  const t=DB.tests.find(x=>x.id===id);
  if(!t)return app('<p class="err">Không tìm thấy đề.</p><a href="#/">Về trang chủ</a>');
  const idxs=scope==='all'?t.parts.map((_,i)=>i):[Number(scope)];
  const mins=scope==='all'?(t.fullMinutes||60):(t.partMinutes||(t.skill==='reading'?20:10));
  R={t,idxs,scope,ans:{},flags:{},checked:{},el:0,mode:'exam',hl:{},notes:'',notesOpen:false,cur:idxs[0],left:mins*60,total:mins*60,started:false,done:false,iv:null,list:{},nums:{}};
  let n=1;
  idxs.forEach(pi=>{R.list[pi]=[];t.parts[pi].groups.forEach((g,gi)=>g.questions.forEach((q,qi)=>{
    const m=qMarks(q,g),k=`${pi}-${gi}-${qi}`,num={from:n,to:n+m-1};n+=m;R.nums[k]=num;R.list[pi].push({k,pi,gi,qi,g,q,num,m});
  }))});
  R.totalQ=n-1;
  onLeave(()=>{clearInterval(R&&R.iv);try{speechSynthesis.cancel()}catch(e){};document.body.classList.remove('exam');document.removeEventListener('mouseup',selHandler);document.removeEventListener('touchend',selHandler);hideMenu();if(R)R.started=false});
  VSRC=t.title;
  app(`<div class="panel"><h1>${esc(t.title)}</h1>
  <p>${scope==='all'?'Làm cả đề':'Mini test: '+esc(t.parts[idxs[0]].title)}. Thời gian: <b>${mins} phút</b>. Số câu hỏi: <b>${R.totalQ}</b>.</p>
  <p class="muted">Giao diện giống bài thi trên máy: bôi đen chữ để highlight hoặc thêm ghi chú, bảng số câu ở cuối màn hình để chuyển câu. Đồng hồ chạy khi bạn bấm bắt đầu và hết giờ bài sẽ tự nộp.${t.skill==='listening'?' Hãy đeo tai nghe và kiểm tra âm lượng trước khi bắt đầu.':''}</p>
  <div class="modes"><button class="btn primary" onclick="beginTest('exam')">Thi thử, tính giờ (${mins} phút)</button><button class="btn" onclick="beginTest('practice')">Luyện tập, không giới hạn giờ</button></div>
  <p class="muted">Thi thử: hết giờ tự nộp, đáp án chỉ hiện sau khi nộp. Luyện tập: bấm Kiểm tra dưới mỗi câu để xem đúng sai và giải thích ngay, đồng hồ chỉ đếm thời gian đã dùng.</p>
  <a class="btn" href="#/list/${t.skill}">Quay lại</a></div>`);
}
function beginTest(mode){
  R.mode=mode==='practice'?'practice':'exam';R.started=true;document.body.classList.add('exam');
  document.addEventListener('mouseup',selHandler);document.addEventListener('touchend',selHandler);
  R.iv=setInterval(()=>{if(R.mode==='practice'){R.el++;updateClock();return}R.left--;updateClock();if(R.left<=0)finishTest(true)},1000);
  renderRun();
}
function updateClock(){
  const c=$('#clock');if(!c)return;
  if(R.mode==='practice'){c.textContent=fmt(R.el);c.className='clock';return}
  c.textContent=fmt(R.left);
  c.className='clock'+(R.left<=60?' urgent':R.left<=300?' warn':'');
}
const rangeLbl=n=>n.from===n.to?String(n.from):n.from+'-'+n.to;
const isAns=x=>{const a=R.ans[x.k];return Array.isArray(a)?a.length>0:!!(a&&String(a).trim())};
function goPart(i){saveHL();R.cur=i;renderRun()}
function jumpQ(k){
  const pi=Number(k.split('-')[0]);
  if(pi!==R.cur){saveHL();R.cur=pi;renderRun()}
  const el=document.getElementById('q_'+k);
  if(el){el.scrollIntoView({block:'center'});const f=el.querySelector('input,select');if(f)f.focus({preventScroll:true})}
}
function setAns(k,v){R.ans[k]=v;renderFoot()}
function setMulti(k,L,on,max,cb){
  const a=Array.isArray(R.ans[k])?R.ans[k].slice():[];
  if(on){if(a.length>=max){cb.checked=false;toast('Chỉ chọn tối đa '+max+' đáp án.');return}a.push(L)}
  else{const i=a.indexOf(L);if(i>=0)a.splice(i,1)}
  R.ans[k]=a.sort();renderFoot();
}
function renderFoot(){
  const el=$('#xfoot');if(!el)return;
  el.innerHTML=R.idxs.map(pi=>{
    const qs=R.list[pi],done=qs.filter(isAns).length;
    if(pi===R.cur)return `<div class="fpart on"><b>Part ${pi+1}</b>${qs.map(x=>`<button class="nb ${isAns(x)?'done':''} ${R.flags[x.k]?'flag':''}" onclick="jumpQ('${x.k}')" aria-label="Câu ${rangeLbl(x.num)}">${rangeLbl(x.num)}</button>`).join('')}</div>`;
    return `<button class="fpart" onclick="goPart(${pi})"><b>Part ${pi+1}</b> ${done} / ${qs.length}</button>`;
  }).join('')+(nFlags()?`<span class="fcount">⚑ ${nFlags()} câu gắn cờ</span>`:'');
}
const nFlags=()=>Object.keys(R.flags).filter(k=>R.flags[k]).length;
function toggleFlag(k){
  R.flags[k]=!R.flags[k];
  const b=document.getElementById('fl_'+k);if(b)b.classList.toggle('on',!!R.flags[k]);
  renderFoot();
}
function fbHTML(x){
  const a=R.ans[x.k],got=score(x.q,x.g,a),ok=got>=x.m,empty=a==null||a===''||(Array.isArray(a)&&!a.length);
  return `<div class="fb ${ok?'ok':'no'}"><b>${ok?'Đúng':empty?'Chưa trả lời':got>0?'Đúng một phần':'Sai'}</b>${ok?'':`. Đáp án đúng: <b>${esc(rightText(x.g,x.q))}</b>`}${x.q.explain?`<div class="exp"><b>Giải thích:</b> ${esc(x.q.explain)}</div>`:''}</div>`;
}
function checkQ(k){
  const x=R.list[k.split('-')[0]].find(y=>y.k===k);
  R.checked[k]=true;document.getElementById('fb_'+k).innerHTML=fbHTML(x);
}
function paraHTML(pi,text,label){
  return String(text||'').split(/\n\s*\n/).filter(x=>x.trim()).map((p,i)=>{
    const key=`p-${pi}-${i}`;
    return `<div class="para">${label?`<span class="pl">${String.fromCharCode(65+i)}</span>`:''}<p class="hl-area" data-hk="${key}">${R.hl[key]||esc(p.trim())}</p></div>`;
  }).join('');
}
function fillHTML(k,q,v,num){
  const parts=String(q.q).split(/_{2,}/);
  const inp=`<input type="text" class="blank" value="${esc(v)}" autocomplete="off" spellcheck="false" aria-label="Đáp án câu ${rangeLbl(num)}" placeholder="${num.from}" oninput="setAns('${k}',this.value)">`;
  if(parts.length>1)return `<p class="qt">${parts.map(esc).join(inp)}</p>`;
  return `<p class="qt">${esc(q.q)}</p>${inp}`;
}
function qHTML(x){
  const {k,g,q,num}=x,T=QT[g.type],v=R.ans[k]==null?'':R.ans[k];
  let body='';
  const qt=`<p class="qt hl-area" data-hk="q-${k}">${R.hl['q-'+k]||esc(q.q)}</p>`;
  if(T.kind==='choice')body=qt+(q.options||[]).map((o,oi)=>{const L=String.fromCharCode(65+oi);return `<label class="opt"><input type="radio" name="r${k}" ${v===L?'checked':''} onchange="setAns('${k}','${L}')"><span>${L}. ${esc(o)}</span></label>`}).join('');
  else if(T.kind==='multi'){const max=x.m,sel=Array.isArray(v)?v:[];body=qt+(q.options||[]).map((o,oi)=>{const L=String.fromCharCode(65+oi);return `<label class="opt"><input type="checkbox" ${sel.includes(L)?'checked':''} onchange="setMulti('${k}','${L}',this.checked,${max},this)"><span>${L}. ${esc(o)}</span></label>`}).join('')}
  else if(T.kind==='fixed')body=qt+`<select aria-label="Câu ${rangeLbl(num)}" onchange="setAns('${k}',this.value)"><option value="">Chọn</option>${T.opts.map(o=>`<option ${v===o?'selected':''}>${o}</option>`).join('')}</select>`;
  else if(T.kind==='match')body=qt+`<select aria-label="Câu ${rangeLbl(num)}" onchange="setAns('${k}',this.value)"><option value="">Chọn</option>${gLabels(g).map(L=>`<option ${v===L?'selected':''}>${L}</option>`).join('')}</select>`;
  else body=fillHTML(k,q,v,num);
  const prac=R.mode==='practice'?`<div style="margin-top:6px"><button class="btn small" onclick="checkQ('${k}')">Kiểm tra</button></div><div id="fb_${k}">${R.checked[k]?fbHTML(x):''}</div>`:'';
  return `<div class="xq" id="q_${k}"><div class="xqside"><div class="xqn">${rangeLbl(num)}</div><button class="flagbtn ${R.flags[k]?'on':''}" id="fl_${k}" onclick="toggleFlag('${k}')" title="Gắn cờ để xem lại" aria-label="Gắn cờ câu ${rangeLbl(num)}">⚑</button></div><div class="xqb">${body}${prac}</div></div>`;
}
function gHeadHTML(pi,gi,g){
  const T=QT[g.type],qs=R.list[pi].filter(x=>x.gi===gi),f=qs[0].num.from,l=qs[qs.length-1].num.to;
  let h=`<div class="ghead"><b>${l>f?`Questions ${f}–${l}`:`Question ${f}`}</b><div class="ginstr">${esc(instr(g,R.t.skill))}</div></div>`;
  if(T.kind==='match'){
    const labs=gLabels(g);
    if(g.type==='map_label'||(T.img&&g.imgKey))h+=`<img class="mapimg" data-img="${g.imgKey||''}" alt="Hình minh hoạ">`;
    if(g.options&&g.options.some(x=>x.trim()))h+=`<div class="optbox"><b>${T.list}</b><ul>${labs.map((L,i)=>`<li><b>${L}</b>&nbsp; ${esc(g.options[i]||'')}</li>`).join('')}</ul></div>`;
    else if(g.type!=='map_label')h+=`<div class="optbox"><b>${T.list}:</b> ${labs.join(', ')}</div>`;
  }else if(T.kind==='fill'&&g.imgKey)h+=`<img class="mapimg" data-img="${g.imgKey}" alt="Hình minh hoạ">`;
  return h;
}
function renderRun(){
  const {t,idxs,cur}=R,part=t.parts[cur],rd=t.skill==='reading';
  const qs=R.list[cur],f=qs.length?qs[0].num.from:0,l=qs.length?qs[qs.length-1].num.to:0;
  let left;
  if(rd){
    left=`<h2>${esc(part.title)}</h2>${part.text?`<div class="passage">${paraHTML(cur,part.text,part.labelParas)}</div>`:''}${part.pdfKey?`<p><a id="pdfopen" target="_blank" rel="noopener">Mở PDF trong tab mới</a></p><iframe id="pdfv" class="pdf" title="Bài đọc PDF"></iframe>`:''}${!part.text&&!part.pdfKey?'<p class="muted">Part này chưa có nội dung bài đọc.</p>':''}`;
  }else{
    left=`<h2>${esc(part.title)}</h2>${part.audioKey?`<audio id="aud" controls preload="auto"></audio><p class="muted">Trong bài thi thật bạn chỉ được nghe một lần.</p>`:''}
    ${part.tts?`<p class="muted">Đề mẫu dùng giọng đọc của trình duyệt.</p><div class="row"><button class="btn primary" onclick="ttsPlay(${cur})">Phát bài nghe</button><button class="btn" onclick="ttsStop()">Dừng</button></div>`:''}
    ${!part.audioKey&&!part.tts?'<p class="muted">Part này chưa có file audio.</p>':''}`;
  }
  const right=part.groups.map((g,gi)=>g.questions.length?gHeadHTML(cur,gi,g)+R.list[cur].filter(x=>x.gi===gi).map(qHTML).join(''):'').join('')||'<p class="muted">Part này chưa có câu hỏi.</p>';
  app(`<div class="xhead"><div><span class="xlogo">IELTS</span><span class="xwho">${esc(t.title)}</span></div>
  <div class="xtimer">${R.mode==='practice'?'Luyện tập, đã dùng':'Thời gian còn lại'} <span class="clock" id="clock">${fmt(R.mode==='practice'?R.el:R.left)}</span></div>
  <div class="row"><button class="btn small" onclick="toggleNotes()">Ghi chú</button><button class="btn small primary" onclick="finishTest()">Nộp bài</button></div></div>
  <div class="xsub"><b>Part ${cur+1}</b> ${rd?'Read the text and answer':'Listen and answer'} ${qs.length?`questions ${f}${l>f?'–'+l:''}.`:'the questions.'} <span class="muted">Bôi đen chữ để highlight, ghi chú hoặc lưu từ vựng. Bấm ⚑ để gắn cờ câu cần xem lại.</span></div>
  <div class="xbody"><section class="xpane l">${left}</section><section class="xpane r">${right}</section></div>
  <div class="xfoot" id="xfoot"></div>
  <aside id="notes" class="notes" ${R.notesOpen?'':'hidden'}><b>Ghi chú của bạn</b><textarea placeholder="Viết nháp ở đây" oninput="R.notes=this.value">${esc(R.notes)}</textarea><div id="noteList"></div></aside>`);
  updateClock();renderFoot();
  if(R.notesOpen)fillNoteList();
  if(part.pdfKey)blobUrl(part.pdfKey).then(u=>{if(u&&$('#pdfv')){$('#pdfv').src=u;$('#pdfopen').href=u}});
  if(part.audioKey)blobUrl(part.audioKey).then(u=>{if(u&&$('#aud'))$('#aud').src=u});
  document.querySelectorAll('img[data-img]').forEach(im=>{const k=im.dataset.img;if(k)blobUrl(k).then(u=>{if(u)im.src=u})});
}
function ttsPlay(pi){
  try{
    speechSynthesis.cancel();
    const txt=R.t.parts[pi].tts;
    (txt.match(/[^.!?]+[.!?]*/g)||[txt]).forEach(s=>{if(!s.trim())return;const u=new SpeechSynthesisUtterance(s.trim());u.lang='en-GB';u.rate=.95;speechSynthesis.speak(u)});
  }catch(e){toast('Trình duyệt không hỗ trợ giọng đọc.')}
}
function ttsStop(){try{speechSynthesis.cancel()}catch(e){}}

/* ---- highlight and notes ---- */
function saveHL(){document.querySelectorAll('.hl-area').forEach(el=>{const k=el.dataset.hk;if(el.innerHTML.includes('<mark'))R.hl[k]=el.innerHTML;else delete R.hl[k]})}
const areaOf=n=>{const e=n&&n.nodeType===3?n.parentElement:n;return e&&e.closest?e.closest('.hl-area'):null};
function hideMenu(){const m=$('#hlmenu');m.hidden=true;HM=null}
function showMenu(rect,html){
  const m=$('#hlmenu');m.innerHTML=html;m.hidden=false;
  const top=rect.top-48>8?rect.top-48:rect.bottom+8;
  m.style.top=top+'px';m.style.left=Math.max(8,Math.min(rect.left,innerWidth-300))+'px';
}
function selHandler(e){
  if(!R||!R.started||R.done)return;
  const menu=$('#hlmenu');if(menu.contains(e.target))return;
  const target=e.target;
  setTimeout(()=>{
    const sel=getSelection();
    if(sel&&!sel.isCollapsed&&sel.rangeCount){
      const r=sel.getRangeAt(0),a=areaOf(r.startContainer),b=areaOf(r.endContainer);
      if(a&&a===b){HM={range:r.cloneRange(),mark:null};showMenu(r.getBoundingClientRect(),'<button onclick="hlApply(false)">Highlight</button><button onclick="hlApply(true)">Ghi chú</button><button onclick="vocabSave()">Lưu từ vựng</button>');return}
    }
    const mk=target.closest&&target.closest('mark.hl');
    if(mk){HM={range:null,mark:mk};showMenu(mk.getBoundingClientRect(),`${mk.dataset.note?`<span class="mn">${esc(mk.dataset.note)}</span>`:''}<button onclick="hlEdit()">${mk.dataset.note?'Sửa ghi chú':'Thêm ghi chú'}</button><button onclick="hlRemove()">Xoá highlight</button>`);return}
    hideMenu();
  },10);
}
function hlApply(withNote){
  if(!HM||!HM.range)return;
  let note='';
  if(withNote){const t=prompt('Nhập ghi chú:');if(t===null){hideMenu();return}note=t.trim()}
  const mk=document.createElement('mark');mk.className='hl'+(note?' hn':'');
  if(note){mk.dataset.note=note;mk.title=note}
  const r=HM.range;
  try{r.surroundContents(mk)}catch(e){mk.appendChild(r.extractContents());r.insertNode(mk)}
  getSelection().removeAllRanges();hideMenu();saveHL();
}
function hlRemove(){
  if(!HM||!HM.mark)return;
  const mk=HM.mark,p=mk.parentNode;
  while(mk.firstChild)p.insertBefore(mk.firstChild,mk);
  p.removeChild(mk);p.normalize();hideMenu();saveHL();
}
function hlEdit(){
  if(!HM||!HM.mark)return;
  const mk=HM.mark,t=prompt('Ghi chú:',mk.dataset.note||'');
  if(t===null){hideMenu();return}
  if(t.trim()){mk.dataset.note=t.trim();mk.title=t.trim();mk.classList.add('hn')}else{delete mk.dataset.note;mk.removeAttribute('title');mk.classList.remove('hn')}
  hideMenu();saveHL();
}
function toggleNotes(){R.notesOpen=!R.notesOpen;$('#notes').hidden=!R.notesOpen;if(R.notesOpen)fillNoteList()}
function fillNoteList(){
  saveHL();const tmp=document.createElement('div'),out=[];
  Object.keys(R.hl).forEach(k=>{tmp.innerHTML=R.hl[k];tmp.querySelectorAll('mark.hn').forEach(m=>out.push(`<li><b>${esc(m.textContent.slice(0,60))}</b>: ${esc(m.dataset.note)}</li>`))});
  $('#noteList').innerHTML=out.length?'<p class="muted" style="margin:10px 0 4px">Ghi chú gắn với đoạn đã highlight</p><ul style="padding-left:18px;margin:0">'+out.join('')+'</ul>':'';
}

/* ---- finish and review ---- */
function ansText(g,q,a){
  const T=QT[g.type];
  if(a==null||a===''||(Array.isArray(a)&&!a.length))return '';
  if(T.kind==='multi')return a.map(L=>L+'. '+(q.options[L.charCodeAt(0)-65]||'')).join('; ');
  if(T.kind==='choice')return a+'. '+(q.options[String(a).charCodeAt(0)-65]||'');
  if(T.kind==='match'){const i=gLabels(g).indexOf(a);return a+(g.options&&g.options[i]?'. '+g.options[i]:'')}
  return String(a);
}
function rightText(g,q){
  const T=QT[g.type];
  if(T.kind==='fill')return String(q.answer).split('|').join(' / ');
  if(T.kind==='multi')return String(q.answer).split(',').map(s=>s.trim()).map(L=>L+'. '+(q.options[L.charCodeAt(0)-65]||'')).join('; ');
  return ansText(g,q,q.answer);
}
function optsText(g,q){
  const T=QT[g.type];
  if(T.kind==='choice'||T.kind==='multi')return (q.options||[]).map((o,i)=>String.fromCharCode(65+i)+'. '+o);
  if(T.kind==='match'&&g.options&&g.options.some(x=>x.trim()))return gLabels(g).map((L,i)=>L+'. '+(g.options[i]||''));
  return [];
}
function itemHTML(it,meta,extra){
  const ok=it.got>=it.m,part=it.got>0&&!ok;
  return `<div class="${meta?'':'rv '+(ok?'ok':'no')}">${meta?'':`<span class="tag ${ok?'ok':'no'}">${ok?'Đúng':part?'Đúng một phần':'Sai'}</span> `}<b>Câu ${esc(it.no)}</b>${tagk(QT[it.type]?QT[it.type].n:it.type)}
  ${meta?`<p class="muted" style="margin:6px 0">Đề: ${esc(it.title)}${it.part&&it.part!==it.title?', '+esc(it.part):''}</p>`:''}
  <p style="margin:6px 0">${esc(qText(it))}</p>

/* ============ evidence: show where the answer is ============ */
let RV=null;
const qText=it=>(it.q&&typeof it.q==='object')?it.q.q:it.q;
const normT=s=>String(s).replace(/[‘’‚‛]/g,"'").replace(/[“”„]/g,'"').replace(/\s/g,' ').toLowerCase();
const trimP=s=>s.replace(/^[\s.,;:"'‘’“”]+|[\s.,;:"'‘’“”]+$/g,'');
function evFragments(q){
  if(q.evidence&&String(q.evidence).trim())return String(q.evidence).split('|').map(trimP).filter(Boolean);
  const ex=String(q.explain||''),quotes=[],re=/[“"]([^”"]{6,}?)[”"]/g;let m;
  while((m=re.exec(ex)))quotes.push(m[1]);
  const frags=quotes.flatMap(x=>x.split(/…|\.{3}/)).map(trimP).filter(x=>x.length>=6);
  const long=frags.filter(x=>x.length>=20);
  return long.length?long:frags;
}
function itemRef(test,it){
  const qt=qText(it),P=test.parts;
  if(it.pi!=null&&P[it.pi]&&P[it.pi].groups[it.gi]&&P[it.pi].groups[it.gi].questions[it.qi]){
    const g=P[it.pi].groups[it.gi];return{pi:it.pi,gi:it.gi,qi:it.qi,g,q:g.questions[it.qi]};
  }
  for(const strict of [true,false])for(let pi=0;pi<P.length;pi++){
    if(strict&&(P[pi].title||'Part '+(pi+1))!==it.part)continue;
    for(let gi=0;gi<P[pi].groups.length;gi++){const g=P[pi].groups[gi];
      for(let qi=0;qi<g.questions.length;qi++)if(g.questions[qi].q===qt)return{pi,gi,qi,g,q:g.questions[qi]};}
  }
  return null;
}
const partText=(test,part)=>test.skill==='reading'?(part.text||''):(part.tts||'');
function itemMarks(test,pi,its){
  const text=partText(test,test.parts[pi]),nt=normT(text),marks=[];
  its.forEach(it=>{
    const ref=itemRef(test,it);if(!ref||ref.pi!==pi)return;
    evFragments(ref.q).forEach(f=>{
      const nf=normT(f).replace(/ +/g,' '),i=nt.indexOf(nf);
      if(i>=0)marks.push({s:i,e:i+nf.length,cls:it.got>=it.m?'ev-ok':'ev-no',num:String(it.no).split('-')[0],id:it._i});
    });
  });
  return marks.sort((a,b)=>a.s-b.s);
}
function evPassageHTML(text,label,marks){
  const paras=[],re=/\n\s*\n/g;let last=0,m;
  while((m=re.exec(text))){paras.push([last,m.index]);last=m.index+m[0].length}
  paras.push([last,text.length]);
  return paras.filter(p=>text.slice(p[0],p[1]).trim()).map((p,i)=>{
    const a=p[0],b=p[1];let out='',pos=a;
    marks.filter(x=>x.e>a&&x.s<b).forEach(x=>{
      const s=Math.max(x.s,a),e=Math.min(x.e,b);if(s<pos)return;
      out+=esc(text.slice(pos,s))+`<mark class="ev ${x.cls}" data-ev="${x.id}"><sup>${x.num}</sup>${esc(text.slice(s,e))}</mark>`;pos=e;
    });
    out+=esc(text.slice(pos,b));
    return `<div class="para">${label?`<span class="pl">${String.fromCharCode(65+i)}</span>`:''}<p>${out}</p></div>`;
  }).join('');
}
function evPanel(test,pi,its,pid){
  VSRC=test.title;
  const part=test.parts[pi],rd=test.skill==='reading',text=partText(test,part),marks=itemMarks(test,pi,its);
  let h=`<h3>${esc(part.title||'Part '+(pi+1))}</h3>`;
  if(!rd&&part.audioKey)h+=`<audio id="evaud_${pid}" controls></audio>`;
  h+=`<p class="evlegend"><mark class="ev ev-no">đỏ</mark> vị trí đáp án của câu bạn làm sai, <mark class="ev ev-ok">xanh</mark> vị trí đáp án của câu đúng. Số nhỏ là số câu.</p>`;
  if(!text)h+=`<p class="muted">${rd&&part.pdfKey?'Bài đọc dạng PDF nên không đánh dấu được vị trí. Hãy mở lại file PDF để đối chiếu.':'Part này chưa có '+(rd?'bài đọc':'transcript')+'.'}</p>`;

  return h;
}
function afterEv(test,pi,pid){

function delEssay(id){if(!confirm('Xoá bài viết này?'))return;DB.essays=DB.essays.filter(x=>x.id!==id);save();historyPage()}


function bandChart(){
  const all=DB.attempts.filter(a=>a.scope==='all'&&(a.skill==='reading'||a.skill==='listening')).sort((a,b)=>a.date-b.date);
  if(!all.length)return '<div class="empty">Làm cả đề Reading hoặc Listening để thấy biểu đồ tiến bộ band theo thời gian.</div>';
  const W=660,H=250,L=44,Rr=18,T=16,B=34,N=all.length;
  const x=i=>N===1?(L+W-Rr)/2:L+i/(N-1)*(W-L-Rr),y=b=>T+(9-b)/5*(H-T-B);
  const C={reading:'#2F5D8A',listening:'#C77A00'};
  let g='';
  for(let b=4;b<=9;b++)g+=`<line x1="${L}" x2="${W-Rr}" y1="${y(b)}" y2="${y(b)}" stroke="#DDE3EA"/><text x="${L-8}" y="${y(b)+4}" text-anchor="end" font-size="11" fill="#5B6B7F">${b}</text>`;
  g+=`<line x1="${L}" x2="${W-Rr}" y1="${y(8)}" y2="${y(8)}" stroke="#2E7D4F" stroke-dasharray="6 4"/><text x="${W-Rr}" y="${y(8)-5}" text-anchor="end" font-size="11" fill="#2E7D4F">Mục tiêu 8.0</text>`;
  ['reading','listening'].forEach(sk=>{
    const pts=all.map((a,i)=>({a,i})).filter(p=>p.a.skill===sk);if(!pts.length)return;
    g+=`<polyline fill="none" stroke="${C[sk]}" stroke-width="2.5" points="${pts.map(p=>x(p.i)+','+y(p.a.band)).join(' ')}"/>`;
    pts.forEach(p=>{g+=`<circle cx="${x(p.i)}" cy="${y(p.a.band)}" r="5" fill="${C[sk]}"><title>${sk==='reading'?'Reading':'Listening'} ${p.a.band}, ${fdate(p.a.date)}, ${esc(p.a.title)}</title></circle>`});
  });
  const f=a=>fdate(a.date).split(',')[0];
  g+=`<text x="${L}" y="${H-8}" font-size="11" fill="#5B6B7F">${esc(f(all[0]))}</text>`+(N>1?`<text x="${W-Rr}" y="${H-8}" text-anchor="end" font-size="11" fill="#5B6B7F">${esc(f(all[N-1]))}</text>`:'');
  const last=sk=>{const a=all.filter(z=>z.skill===sk).pop();return a?`${sk==='reading'?'Reading':'Listening'}: ${a.band}`:''};
  return `<div class="panel"><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Biểu đồ band theo thời gian" style="max-width:${W}px"><rect width="${W}" height="${H}" fill="#fff"/>${g}</svg>
  <div class="row" style="gap:18px;font-size:.92rem"><span><b style="color:${C.reading}">Reading</b></span><span><b style="color:${C.listening}">Listening</b></span><span class="muted">Mỗi điểm là một lần làm cả đề. Gần nhất: ${[last('reading'),last('listening')].filter(Boolean).join(', ')}</span></div></div>`;
}

function qMulti(pi,gi,qi,L,on){

function ansControl(pi,gi,qi,g,q){
  const T=QT[g.type],id=`${pi},${gi},${qi}`;
  if(T.kind==='choice')return `<select onchange="qSet(${id},'answer',this.value)"><option value="">Chọn đáp án đúng</option>${'ABCDEF'.split('').map(L=>`<option ${q.answer===L?'selected':''}>${L}</option>`).join('')}</select>`;
  if(T.kind==='multi'){const sel=String(q.answer||'').split(',');return `<div><b style="font-size:.9rem">Các đáp án đúng:</b> ${'ABCDEFG'.split('').map(L=>`<label class="chk"><input type="checkbox" ${sel.includes(L)?'checked':''} onchange="qMulti(${id},'${L}',this.checked)">${L}</label>`).join('')}</div>`}
  if(T.kind==='fixed')return `<select onchange="qSet(${id},'answer',this.value)"><option value="">Chọn đáp án đúng</option>${T.opts.map(L=>`<option ${q.answer===L?'selected':''}>${L}</option>`).join('')}</select>`;
  if(T.kind==='match')return `<select onchange="qSet(${id},'answer',this.value)"><option value="">Chọn đáp án đúng</option>${gLabels(g).map(L=>`<option ${q.answer===L?'selected':''}>${L}</option>`).join('')}</select>`;

  if(T.kind==='match'){
    extra+=`<label>${T.list} (mỗi dòng một lựa chọn, tự gán nhãn ${T.roman?'i, ii, iii':'A, B, C'})</label><textarea rows="5" oninput="gSet(${pi},${gi},'options',this.value.split('\\n'));" onchange="renderEditor()">${esc((g.options||[]).join('\n'))}</textarea>`;

  const qs=g.questions.map((q,qi)=>{
    const lab=T.kind==='fill'?'Câu (dùng ______ cho chỗ trống)':T.kind==='match'?'Nội dung cần nối (ví dụ: Paragraph B, hoặc một nhận định)':'Nội dung câu hỏi';

function saveTest(){
  if(!E.title.trim())return toast('Hãy nhập tên đề.');
  const t=JSON.parse(JSON.stringify(E));
  for(const p of t.parts){
    p.groups=p.groups.filter(g=>g.questions.some(q=>q.q.trim()));
    for(const g of p.groups){
      const T=QT[g.type];
      g.questions=g.questions.filter(q=>q.q.trim());
      if(T.kind==='match'){g.options=(g.options||[]).map(o=>o.trim().replace(/^([A-Za-z]|[ivxIVX]+)[.)]\s+/,'')).filter(Boolean)}
      else g.options=[];
      for(const q of g.questions){
        if(T.kind==='choice'||T.kind==='multi')q.options=(q.options||[]).map(o=>o.trim().replace(/^[A-Ga-g][.)]\s+/,'')).filter(Boolean);
        else q.options=[];
        q.answer=String(q.answer||'').trim();
        if(!q.answer)return toast('Có câu hỏi chưa có đáp án đúng.');
        if(T.kind==='match'&&!gLabels(g).includes(q.answer))return toast('Một đáp án nối không nằm trong danh sách lựa chọn.');
      }
    }
  }
  if(!t.parts.some(p=>p.groups.length))return toast('Đề cần ít nhất 1 câu hỏi.');
  const i=DB.tests.findIndex(x=>x.id===t.id);
  if(i>=0)DB.tests[i]=t;else DB.tests.push(t);
  save();toast('Đã lưu đề.');location.hash='#/manage';
}

function importJsonPage(){
  app(`<h1>Nhập đề từ JSON</h1><p class="lead">Dán JSON dạng <code>{"tests":[...],"writing":[...],"speaking":[...]}</code>. Bạn có thể nhờ Claude soạn đề theo đúng định dạng này (chỉ nội dung chữ, file PDF, audio và hình ảnh tải lên trong màn hình sửa đề). Các giá trị <code>type</code> hợp lệ: ${Object.keys(QT).join(', ')}.</p>
  <div class="form"><textarea id="jsonin" rows="16" placeholder='{"tests":[{"skill":"reading","title":"...","fullMinutes":60,"partMinutes":20,"parts":[{"title":"Part 1","text":"...","labelParas":true,"groups":[{"type":"mcq","questions":[{"q":"...","options":["...","..."],"answer":"B","explain":"..."}]},{"type":"match_headings","options":["heading 1","heading 2"],"questions":[{"q":"Paragraph A","answer":"ii"}]}]}]}]}'></textarea>
  <div class="row" style="margin-top:14px"><button class="btn primary" onclick="doImportJson()">Nhập đề</button><a class="btn" href="#/manage">Huỷ</a></div></div>`);
}
function doImportJson(){
  try{
    let d=JSON.parse($('#jsonin').value);if(Array.isArray(d))d={tests:d};
    let n=0;
    (d.tests||[]).forEach(t=>{
      if(!['reading','listening'].includes(t.skill)||!t.title||!Array.isArray(t.parts))throw new Error('Đề thiếu skill, title hoặc parts.');
      t.id=uid();t.collection=t.collection||'';t.fullMinutes=t.fullMinutes||60;t.partMinutes=t.partMinutes||(t.skill==='reading'?20:10);
      t.parts.forEach(p=>{
        p.text=p.text||'';p.tts=p.tts||'';p.pdfKey=null;p.audioKey=null;p.labelParas=!!p.labelParas;
        (p.groups||[]).forEach(g=>{
          if(!QT[g.type])throw new Error('Dạng bài không hợp lệ: '+g.type);
          g.title=g.title||'';g.maxWords=g.maxWords||0;g.options=g.options||[];g.count=g.count||0;g.imgKey=null;g.imgName='';
          g.questions=(g.questions||[]).map(q=>({q:q.q||'',options:q.options||[],answer:String(q.answer||''),explain:q.explain||'',evidence:q.evidence||'',time:q.time||''}));
        });
      });
      DB.tests.push(t);n++;
    });
    migrate({tests:d.tests||[]});
    (d.writing||[]).forEach(w=>{DB.writing.push({id:uid(),task:w.task===1?1:2,kind:w.kind||'',title:w.title||'Đề Writing',prompt:w.prompt||'',imgKey:null});n++});
    (d.speaking||[]).forEach(s=>{DB.speaking.push({id:uid(),part:[1,2,3].includes(s.part)?s.part:1,kind:s.kind||'',title:s.title||'Đề Speaking',content:s.content||''});n++});
    save();toast('Đã nhập '+n+' đề.');location.hash='#/manage';
  }catch(e){toast('JSON không hợp lệ: '+e.message)}
}

function backupPage(){
  app(`<h1>Sao lưu</h1><p class="lead">Toàn bộ dữ liệu (đề, bài làm, file PDF, audio, bản ghi âm) nằm trong trình duyệt này. Nếu xoá dữ liệu trình duyệt hoặc đổi máy, bạn sẽ mất hết. Hãy xuất bản sao lưu thường xuyên.</p>
  <div class="row"><button class="btn primary" onclick="exportAll()">Xuất bản sao lưu</button>
  <label class="btn">Nhập bản sao lưu<input type="file" accept="application/json" style="display:none" onchange="importAll(this)"></label>
  <button class="btn" onclick="restoreSamples()">Khôi phục đề mẫu</button></div>
  <p class="muted" style="margin-top:18px">Lưu ý: nhập bản sao lưu sẽ thay thế toàn bộ dữ liệu hiện tại.</p>`);

const toDataUrl=b=>new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(b)});
async function exportAll(){
  toast('Đang xuất dữ liệu...');
  const files={};for(const k of await fkeys()){const b=await fget(k);if(b)files[k]=await toDataUrl(b)}
  download('ielts-studio-backup-'+new Date().toISOString().slice(0,10)+'.json',new Blob([JSON.stringify({db:DB,files})],{type:'application/json'}));
}
async function importAll(inp){
  const f=inp.files[0];if(!f)return;
  if(!confirm('Thay thế toàn bộ dữ liệu hiện tại bằng bản sao lưu này?'))return;
  try{
    const d=JSON.parse(await f.text());if(!d.db||!d.db.tests)throw new Error('File không đúng định dạng.');
    for(const k of await fkeys())await fdel(k);
    for(const k in d.files||{}){const b=await (await fetch(d.files[k])).blob();await fput(k,b)}
    DB=migrate(d.db);save();toast('Đã nhập bản sao lưu.');location.hash='#/';
  }catch(e){toast('Không nhập được: '+e.message)}
}
function restoreSamples(){
  const s=samples();
  s.tests.forEach(t=>{if(!DB.tests.some(x=>x.id===t.id))DB.tests.push(t)});
  s.writing.forEach(t=>{if(!DB.writing.some(x=>x.id===t.id))DB.writing.push(t)});
  s.speaking.forEach(t=>{if(!DB.speaking.some(x=>x.id===t.id))DB.speaking.push(t)});
  save();toast('Đã thêm các đề mẫu còn thiếu.');
}


/* ============ vocabulary notebook ============ */
let VSRC='',VC=null;
function vocabSave(){
  if(!HM||!HM.range)return;
  const r=HM.range,word=r.toString().replace(/\s+/g,' ').trim();
  hideMenu();
  if(!word)return;
  if(word.length>120)return toast('Hãy chọn một từ hoặc cụm từ ngắn hơn.');
  let node=r.commonAncestorContainer;node=node.nodeType===3?node.parentElement:node;
  const blk=(node.closest&&node.closest('p,li,.qt,.xqb'))||node,c=blk.cloneNode(true);
  c.querySelectorAll('sup').forEach(z=>z.remove());
  const txt=c.textContent.replace(/\s+/g,' '),i=txt.toLowerCase().indexOf(word.toLowerCase());
  let ctx=txt;
  if(i>=0){let a=-1,b=txt.length;for(const ch of '.!?'){a=Math.max(a,txt.lastIndexOf(ch,i-1));const n=txt.indexOf(ch,i+word.length);if(n>=0)b=Math.min(b,n+1)}ctx=txt.slice(a+1,b).trim()}
  try{getSelection().removeAllRanges()}catch(e){}
  const note=prompt('Nghĩa hoặc ghi chú cho "'+word+'" (có thể bỏ trống):','');
  if(note===null)return;
  if(DB.vocab.some(v=>v.word.toLowerCase()===word.toLowerCase()))return toast('Từ này đã có trong sổ từ vựng.');
  DB.vocab.push({id:uid(),word,ctx:ctx.slice(0,300),note:note.trim(),src:VSRC||'',date:Date.now()});
  save();toast('Đã lưu "'+word+'" vào sổ từ vựng.');
}
function vocabSel(e){
  if(R&&R.started&&!R.done)return;
  const menu=$('#hlmenu');if(menu.contains(e.target))return;
  setTimeout(()=>{
    const sel=getSelection();
    if(sel&&!sel.isCollapsed&&sel.rangeCount){
      const r=sel.getRangeAt(0),n=r.commonAncestorContainer,el=n.nodeType===3?n.parentElement:n;
      if(el&&el.closest&&el.closest('.evtext')){HM={range:r.cloneRange(),mark:null};showMenu(r.getBoundingClientRect(),'<button onclick="vocabSave()">Lưu từ vựng</button>');return}
    }
    if(!menu.hidden)hideMenu();
  },10);
}
document.addEventListener('mouseup',vocabSel);document.addEventListener('touchend',vocabSel);
function vocabPage(){
  VC=null;
  app(`<div class="row sp"><h1>Sổ từ vựng</h1><div class="row"><button class="btn" onclick="vocabCards()">Ôn tập thẻ từ</button><button class="btn" onclick="vocabCopy()">Sao chép để nhờ Claude giải nghĩa</button><button class="btn primary" onclick="vocabAdd()">Thêm từ</button></div></div>
  <p class="lead">Khi làm bài hoặc xem lại đáp án, bôi đen một từ hay cụm từ rồi chọn "Lưu từ vựng". Web lưu kèm câu chứa từ đó.</p>
  <div id="vcard"></div>
  <div class="form"><input type="text" id="vq" placeholder="Tìm từ hoặc nghĩa" oninput="vocabList()" aria-label="Tìm từ"></div>

function vocabList(){
  const q=($('#vq')?$('#vq').value:'').toLowerCase();
  const vs=DB.vocab.filter(v=>!q||v.word.toLowerCase().includes(q)||(v.note||'').toLowerCase().includes(q)).slice().reverse();
  $('#vcount').textContent=DB.vocab.length+' từ trong sổ';
  $('#vlist').innerHTML=vs.length?vs.map(v=>`<div class="rv"><div class="row sp"><b style="font-size:1.1rem">${esc(v.word)}</b><span class="row"><button class="btn small" onclick="vocabEdit('${v.id}')">Sửa nghĩa</button><button class="btn small danger" onclick="vocabDel('${v.id}')">Xoá</button></span></div>${v.note?`<div>${esc(v.note)}</div>`:'<div class="muted">Chưa có nghĩa. Bấm Sửa nghĩa để thêm.</div>'}${v.ctx?`<p class="muted" style="margin:6px 0 0"><i>${esc(v.ctx)}</i></p>`:''}<div class="muted" style="font-size:.85rem">${esc(v.src||'Thêm thủ công')}, ${fdate(v.date)}</div></div>`).join(''):'<div class="empty">Chưa có từ nào. Hãy bôi đen một từ trong bài đọc hoặc bấm Thêm từ.</div>';
}
function vocabAdd(){
  const w=prompt('Từ hoặc cụm từ:');if(!w||!w.trim())return;
  if(DB.vocab.some(v=>v.word.toLowerCase()===w.trim().toLowerCase()))return toast('Từ này đã có trong sổ từ vựng.');
  const n=prompt('Nghĩa hoặc ghi chú:','');if(n===null)return;
  DB.vocab.push({id:uid(),word:w.trim(),ctx:'',note:n.trim(),src:'',date:Date.now()});save();vocabList();

function vocabEdit(id){const v=DB.vocab.find(x=>x.id===id),n=prompt('Nghĩa hoặc ghi chú cho "'+v.word+'":',v.note||'');if(n===null)return;v.note=n.trim();save();vocabList()}
function vocabDel(id){if(!confirm('Xoá từ này?'))return;DB.vocab=DB.vocab.filter(x=>x.id!==id);save();vocabList()}
function vocabCopy(){
  if(!DB.vocab.length)return toast('Sổ từ vựng đang trống.');

function vocabCards(){

  <div class="row" style="justify-content:center;margin-top:14px"><button class="btn" onclick="VC.show=!VC.show;vcardRender()">${VC.show?'Ẩn nghĩa':'Hiện nghĩa'}</button><button class="btn primary" onclick="vcardNext()">Từ tiếp theo</button><button class="btn" onclick="VC=null;$('#vcard').innerHTML=''">Đóng</button></div></div>`;
}
function vcardNext(){VC.i=(VC.i+1)%VC.deck.length;VC.show=false;vcardRender()}

route();
</script>
